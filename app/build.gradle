plugins {
    id 'com.android.application'
}

android {
    namespace 'ro.bucharest.transit'
    compileSdk 35

    defaultConfig {
        applicationId 'ro.bucharest.transit'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    signingConfigs {
        release {
            // supplied by CI; without them assembleRelease stays unsigned, which
            // is what a local build and an F-Droid build both want
            def store = System.getenv('KEYSTORE_FILE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
